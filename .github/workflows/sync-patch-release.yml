name: Sync, Patch, and Release

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Suffix for the tag (e.g. patch-1)'
        required: false
        default: 'patch-1'

permissions:
  contents: write

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Patch
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. Add the original repository as a remote
          git remote add upstream https://github.com/imsyy/yt-dlp-gui.git
          git fetch upstream master || git fetch upstream main
          UPSTREAM_BRANCH=$(git remote show upstream | grep 'HEAD branch' | cut -d' ' -f5)
          
          # 2. Reset everything to upstream
          git reset --hard "upstream/$UPSTREAM_BRANCH"
          
          # 3. Restore our custom files from the patch-storage branch
          # This ensures we always have the correct patch and workflow regardless of upstream changes
          git fetch origin patch-storage
          git checkout origin/patch-storage -- cli-args-support.patch .github/workflows/sync-patch-release.yml
          
          # 4. Apply the patch to the new code
          git apply --whitespace=fix cli-args-support.patch
          
          # 5. Commit the changes
          git add .
          git commit -m "Auto-sync with upstream and apply custom patch" || echo "No changes to commit"
          
          # 6. Push back to master
          git push origin HEAD:master --force

      - name: Get Version
        id: get_version
        run: |
          # Use jq to parse version from tauri.conf.json
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION-${{ github.event.inputs.tag_suffix }}" >> $GITHUB_OUTPUT

  build-and-release:
    needs: sync-and-patch
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master # Ensure we use the freshly pushed master

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.sync-and-patch.outputs.tag }}
          releaseName: "YDL GUI ${{ needs.sync-and-patch.outputs.tag }}"
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
