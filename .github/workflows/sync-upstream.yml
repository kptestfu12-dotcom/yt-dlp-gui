name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Patch
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. Save our custom patch and workflows to a temporary location
          mkdir -p ../temp_files
          cp cli-args-support.patch ../temp_files/
          mkdir -p ../temp_files/workflows
          cp .github/workflows/*.yml ../temp_files/workflows/
          
          # 2. Add the original repository as a remote
          git remote add upstream https://github.com/imsyy/yt-dlp-gui.git
          git fetch upstream master
          
          # 3. Force reset our master to the original's master
          git checkout master
          git reset --hard upstream/master
          
          # 4. Restore our custom files
          cp ../temp_files/cli-args-support.patch .
          mkdir -p .github/workflows
          cp ../temp_files/workflows/*.yml .github/workflows/
          
          # 5. Apply the patch to the new code
          git apply cli-args-support.patch
          
          # 6. Commit and Force Push back to your fork
          git add .
          git commit -m "Auto-sync with upstream and re-apply custom patch"
          git push origin master --force